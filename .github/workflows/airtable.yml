# Airtable jobs, started by hand from the GitHub "Actions" tab (Run workflow).
# GitHub's servers can reach api.airtable.com; the token stays in the repository's secrets (AIRTABLE_TOKEN).
name: Airtable

on:
  workflow_dispatch:
    inputs:
      job:
        description: "What to do"
        type: choice
        options:
          - verify-base
          - build-new-base
          - reset-and-refill-base
          - pull-content
          - fetch-photos
        default: verify-base
      workspace_id:
        description: "Workspace ID (starts with wsp…) or the link of the workspace page, only for build-new-base"
        required: false
        type: string

      confirm:
        description: "Type RESET to confirm reset-and-refill-base (deletes every row of the base, then writes the content again)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: airtable
  cancel-in-progress: false

jobs:
  airtable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build a new base and fill it
        if: inputs.job == 'build-new-base'
        env:
          AIRTABLE_WORKSPACE_ID: ${{ inputs.workspace_id }}
        run: pnpm --filter rivieres-canyons airtable:build

      - name: Complete the base and write the content again
        if: inputs.job == 'reset-and-refill-base'
        env:
          AIRTABLE_CONFIRM: ${{ inputs.confirm }}
        run: pnpm --filter rivieres-canyons airtable:reset

      - name: Check the base against the repository (read-only)
        if: inputs.job == 'verify-base'
        run: pnpm --filter rivieres-canyons exec tsx scripts/airtable.ts verify

      - name: Pull the content from Airtable and check it
        if: inputs.job == 'pull-content'
        run: |
          pnpm --filter rivieres-canyons content:pull
          pnpm --filter rivieres-canyons content:verify
          pnpm --filter rivieres-canyons photos:fetch

      - name: Download the photos (the site serves its own copies)
        if: inputs.job == 'fetch-photos'
        run: pnpm --filter rivieres-canyons photos:fetch

      - name: Save the results to the repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add apps/rivieres-canyons/airtable apps/rivieres-canyons/content/fixtures apps/rivieres-canyons/src/assets/photos apps/rivieres-canyons/src/assets/logos docs/CONTENT_REPORT.md
          git diff --cached --quiet || git commit -m "Airtable: ${{ inputs.job }} (run ${{ github.run_number }})"
          git push
