# Cloudflare Pages project (phase 7 connects it). Build command: pnpm build · output: dist · functions: ./functions
name = "rivieres-canyons"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

# Leads and click logs (CLAUDE.md §4). Create once with `wrangler d1 create rivieres-canyons`, paste the id below,
# then `wrangler d1 migrations apply rivieres-canyons --remote`.
[[d1_databases]]
binding = "DB"
database_name = "rivieres-canyons"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Secrets (set in the Cloudflare dashboard, never in this file): TURNSTILE_SECRET, LEAD_ENDPOINT (later), LEAD_ENDPOINT_TOKEN (later).
# Build variables: SITE_URL, PUBLIC_TURNSTILE_SITE_KEY, PUBLIC_CF_BEACON_TOKEN.
